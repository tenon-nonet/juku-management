# -----------------------------------------------
# 共通設定（git管理対象・シークレットなし）
# 環境固有の値は application-local.properties / application-prod.properties に記述
# 起動時: -Dspring.profiles.active=local または --spring.profiles.active=prod を指定
# -----------------------------------------------

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/juku}
spring.datasource.username=${DB_USERNAME:juku}
spring.datasource.password=${DB_PASSWORD:juku}

# JPA
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:kokakan-juku-management-secret-key-change-in-production-256bit}
app.jwt.expiration=86400000

# Server
server.port=8080
