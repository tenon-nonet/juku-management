services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: juku
      POSTGRES_USER: juku_user
      POSTGRES_PASSWORD: juku_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juku_user -d juku"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_local_data:
